<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şevval</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="petals"></div>

    <main class="container">
        <div class="bouquet">
            <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="Kırmızı zambaklar ve beyaz güllerden oluşan buket">
                <defs>
                    <linearGradient id="lily-petal" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#ffaaa8" />
                        <stop offset=".5" stop-color="#ee506c" />
                        <stop offset="1" stop-color="#a80735" />
                    </linearGradient>
                    <linearGradient id="rose-petal" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#fffdf7" />
                        <stop offset=".65" stop-color="#f7f1e4" />
                        <stop offset="1" stop-color="#e6dcc8" />
                    </linearGradient>
                    <symbol id="rose-bloom" viewBox="-36 -36 72 72">
                        <path d="M0-31C10-34 20-27 21-17C31-12 33 0 26 8C25 20 15 28 4 26C-6 34-19 28-21 18C-32 12-33-2-25-10C-25-22-14-30-4-26Z"
                            fill="url(#rose-petal)" stroke="#d8cebd" stroke-width="1.2" />
                        <g fill="#fffdf7" stroke="#d8cebd" stroke-width="1">
                            <path d="M0-28C10-31 17-23 14-15C12-9 5-7 0-12C-5-17-4-24 0-28Z" />

                                transform="rotate(216)" fill="#f5efdf" />
                            <path d="M0-28C10-31 17-23 14-15C12-9 5-7 0-12C-5-17-4-24 0-28Z"
                                transform="rotate(288)" />
                        </g>
                        <g fill="#fffaf0" stroke="#d4c8b3" stroke-width=".9">
                            <path d="M0-19C8-22 14-16 12-9C11-3 5-1 1-5C-3-9-3-15 0-19Z" />
                            <path d="M0-19C8-22 14-16 12-9C11-3 5-1 1-5C-3-9-3-15 0-19Z"
                                transform="rotate(120)" fill="#f7f1e5" />
                            <path d="M0-19C8-22 14-16 12-9C11-3 5-1 1-5C-3-9-3-15 0-19Z"
                                transform="rotate(240)" />
                        </g>
                        <path d="M-5-7C-3-12 3-12 5-7C7-3 3 1 0 2C-4 0-7-3-5-7Z"
                            fill="#eee4d2" stroke="#d4c8b3" stroke-width=".8" />
                        <circle cx="0" cy="0" r="4" fill="#e4d7b8" stroke="#d0c4aa" />
                        <circle cx="-1" cy="-1" r="1.2" fill="#fffef9" />
                    </symbol>
                </defs>

                <path d="M 200 500 C 198 365, 199 250, 200 174" stroke="#3d5a40" stroke-width="6" fill="none" />
                <path d="M 200 500 C 150 370, 125 270, 105 238" stroke="#3d5a40" stroke-width="5" fill="none" />
                <path d="M 200 500 C 250 370, 275 270, 295 238" stroke="#3d5a40" stroke-width="5" fill="none" />
                <path d="M 200 500 C 170 380, 160 300, 160 201" stroke="#3d5a40" stroke-width="4" fill="none" />
                <path d="M 200 500 C 230 380, 240 300, 240 201" stroke="#3d5a40" stroke-width="4" fill="none" />

                <path d="M 150 280 C 120 260, 90 250, 70 260 C 90 290, 120 310, 150 300 Z" fill="#4f772d"
                    opacity="0.9" />
                <path d="M 250 280 C 280 260, 310 250, 330 260 C 310 290, 280 310, 250 300 Z" fill="#4f772d"
                    opacity="0.9" />
                <path d="M 110 320 C 80 305, 55 300, 40 310 C 55 335, 80 355, 110 345 Z" fill="#606c38"
                    opacity="0.9" />
                <path d="M 290 320 C 320 305, 345 300, 360 310 C 345 335, 320 355, 290 345 Z" fill="#606c38"
                    opacity="0.9" />

                <defs>
                <g id="lily-left" transform="translate(105 285)">
                    <g fill="url(#lily-petal)" stroke="#a8071a" stroke-width="0.8">
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(60)" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(120)" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(180)" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(240)" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(300)" />
                    </g>
                    <g fill="#5b1018">
                        <circle cx="0" cy="-27" r="1.8" />
                        <circle cx="9" cy="-17" r="1.8" />
                        <circle cx="-10" cy="-17" r="1.8" />
                        <circle cx="0" cy="0" r="4" />
                    </g>
                    <g stroke="#f4c95d" stroke-width="1.5" stroke-linecap="round">
                        <path d="M0 0 Q-8-13-15-23" />
                        <path d="M0 0 Q0-16 0-28" />
                        <path d="M0 0 Q8-13 15-23" />
                    </g>
                    <g fill="#f4c95d">
                        <ellipse cx="-15" cy="-23" rx="2.5" ry="4" transform="rotate(-30 -15 -23)" />
                        <ellipse cx="0" cy="-28" rx="2.5" ry="4" />
                        <ellipse cx="15" cy="-23" rx="2.5" ry="4" transform="rotate(30 15 -23)" />
                    </g>
                </g>

                <g id="lily-right" transform="translate(295 285)">
                    <g fill="url(#lily-petal)" stroke="#a8071a" stroke-width="0.8">
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(60)" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(120)" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(180)" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(240)" />
                        <path d="M0 0 C-11-12-16-32 0-47 C16-32 11-12 0 0Z" transform="rotate(300)" />
                    </g>
                    <g fill="#5b1018">
                        <circle cx="0" cy="-27" r="1.8" />
                        <circle cx="9" cy="-17" r="1.8" />
                        <circle cx="-10" cy="-17" r="1.8" />
                        <circle cx="0" cy="0" r="4" />
                    </g>
                    <g stroke="#f4c95d" stroke-width="1.5" stroke-linecap="round">
                        <path d="M0 0 Q-8-13-15-23" />
                        <path d="M0 0 Q0-16 0-28" />
                        <path d="M0 0 Q8-13 15-23" />
                    </g>
                    <g fill="#f4c95d">
                        <ellipse cx="-15" cy="-23" rx="2.5" ry="4" transform="rotate(-30 -15 -23)" />
                        <ellipse cx="0" cy="-28" rx="2.5" ry="4" />
                        <ellipse cx="15" cy="-23" rx="2.5" ry="4" transform="rotate(30 15 -23)" />
                    </g>
                </g>

                </defs>

                <use href="#lily-left" transform="translate(13 -13) scale(.88)" />
                <use href="#lily-right" transform="translate(35 -13) scale(.88)" />
                <use href="#lily-left" transform="translate(59 86) scale(.68)" />
                <use href="#lily-right" transform="translate(69 86) scale(.68)" />

                <use href="#rose-bloom" x="112" y="170" width="58" height="58" />
                <use href="#rose-bloom" x="171" y="145" width="58" height="58" />
                <use href="#rose-bloom" x="230" y="170" width="58" height="58" />
                <use href="#rose-bloom" x="126" y="231" width="58" height="58" />
                <use href="#rose-bloom" x="171" y="215" width="58" height="58" />
                <use href="#rose-bloom" x="216" y="231" width="58" height="58" />

                <g fill="url(#rose-petal)" stroke="#d7a59f" stroke-width="1.5">
                    <path d="M92 342C125 365 164 374 200 374C236 374 275 365 308 342L267 487C225 500 175 500 133 487Z" />
                    <path d="M92 342C126 356 164 362 200 362C236 362 274 356 308 342" fill="none"
                        stroke="#fff9f3" stroke-width="4" />
                    <path d="M200 376C185 361 161 373 169 390C176 404 200 419 200 419C200 419 224 404 231 390C239 373 215 361 200 376Z"
                        fill="#d65b75" stroke="#ad3854" />
                </g>
            </svg>
        </div>

        <h1 class="love-text">Şevval,<br>seni çoooook seviyorum</h1>
        <p class="rose-note">(gülleri çok iyi çizemedim ama gül onlar tamam mı)</p>
    </main>

    <audio id="bg-music" src="rosemary.mp3" loop playsinline></audio>

    <button class="music-btn" id="musicBtn">
        <span class="btn-icon">♪</span>
        <span class="btn-text">Müziği Başlat</span>
    </button>

    <script src="script.js"></script>
</body>

</html>
